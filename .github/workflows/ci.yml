name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to main supersedes the run from the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Active LTS; the suite only needs WebCrypto + full ICU (both default
          # here) — the dev machine runs a newer Node, nothing depends on it.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail-fast order: the cheapest gates first. `npm run build` re-runs
      # tsc, but keeping typecheck separate makes a type error read as one.
      - name: Typecheck
        run: npm run typecheck

      - name: i18n keys (fr/en/es)
        run: node scripts/check-i18n.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
