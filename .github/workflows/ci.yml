name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to main supersedes the run from the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Active LTS; the suite only needs WebCrypto + full ICU (both default
          # here) — the dev machine runs a newer Node, nothing depends on it.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail-fast order: the cheapest gates first. `npm run build` re-runs
      # tsc, but keeping typecheck separate makes a type error read as one.
      - name: Typecheck
        run: npm run typecheck

      - name: i18n keys (fr/en/es)
        run: node scripts/check-i18n.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The exact bytes CI verified are what deploy publishes — no rebuild
      # in the deploy job, no drift between "tested" and "shipped".
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy:
    # Publishes the audited build to Cloudflare Pages. Needs the one-time
    # setup (scripts/cloudflare-deploy-setup.sh): the CLOUDFLARE_API_TOKEN
    # and CLOUDFLARE_ACCOUNT_ID repository secrets. Until they exist the
    # publish step is skipped (with a notice) and CI stays green.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Step-level `if` cannot read `secrets` directly; mirror it here.
      CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Publish to Cloudflare Pages
        if: env.CF_TOKEN_SET == 'true'
        uses: cloudflare/wrangler-action@v3
        env:
          WRANGLER_LOG: error
        with:
          # Least-privilege token: Cloudflare Pages → Edit only. The first
          # deploy creates the `budget-et-compte` project; afterwards every
          # push to main becomes a production deployment automatically.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=budget-et-compte --branch=main --commit-dirty=true

      - name: Deploy skipped — one-time setup not done
        if: env.CF_TOKEN_SET != 'true'
        run: |
          echo "Deploy skipped: CLOUDFLARE_API_TOKEN is not a repository secret yet."
          echo "One-time setup: scripts/cloudflare-deploy-setup.sh (see run doc, decision log)."
