name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Verify needs nothing beyond read; the deploy job scopes its own
# Pages/OIDC permissions — least privilege per job.
permissions:
  contents: read

# A new push to main supersedes the run from the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Active LTS; the suite only needs WebCrypto + full ICU (both default
          # here) — the dev machine runs a newer Node, nothing depends on it.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail-fast order: the cheapest gates first. `npm run build` re-runs
      # tsc, but keeping typecheck separate makes a type error read as one.
      - name: Typecheck
        run: npm run typecheck

      - name: i18n keys (fr/en/es)
        run: node scripts/check-i18n.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Pages serves a project site from the repo subpath by default.
          # When a custom domain is attached (repository variable PAGES_BASE
          # set to "/" by scripts/custom-domain.sh), the same build ships
          # root-relative. The same build is both tested and deployed.
          VITE_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}

      # The exact bytes CI verified are what deploy publishes — no rebuild
      # in the deploy job, no drift between "tested" and "shipped".
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy:
    # Publishes the audited build to GitHub Pages (the repo is public, so
    # Pages needs no secret and no third-party token). The artifact from
    # verify is re-uploaded in the Pages format and deployed — still the
    # same tested bytes.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only the deploy job may publish to Pages (OIDC).
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The smoke test below runs a repo script, and the deploy job does not
      # inherit the workspace — check the repo out here too.
      - uses: actions/checkout@v7

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test the live site
        # Retries sized to absorb the first deployment's propagation.
        env:
          SMOKE_RETRIES: '12'
        run: scripts/smoke-test.sh "${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
