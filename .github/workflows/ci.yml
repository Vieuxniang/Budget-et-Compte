name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages: write` + `id-token: write` are what the GitHub Pages deploy
# (OIDC) needs; `contents: read` is the least the checkout requires.
permissions:
  contents: read
  pages: write
  id-token: write

# A new push to main supersedes the run from the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Active LTS; the suite only needs WebCrypto + full ICU (both default
          # here) — the dev machine runs a newer Node, nothing depends on it.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail-fast order: the cheapest gates first. `npm run build` re-runs
      # tsc, but keeping typecheck separate makes a type error read as one.
      - name: Typecheck
        run: npm run typecheck

      - name: i18n keys (fr/en/es)
        run: node scripts/check-i18n.mjs

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Pages serves a project site from the repo subpath. The same
          # build is both tested and deployed, so the base is set here.
          VITE_BASE: /${{ github.event.repository.name }}/

      # The exact bytes CI verified are what deploy publishes — no rebuild
      # in the deploy job, no drift between "tested" and "shipped".
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy:
    # Publishes the audited build to GitHub Pages (the repo is public, so
    # Pages needs no secret and no third-party token). The artifact from
    # verify is re-uploaded in the Pages format and deployed — still the
    # same tested bytes.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test the live site
        # Retries sized to absorb the first deployment's propagation.
        env:
          SMOKE_RETRIES: '12'
        run: scripts/smoke-test.sh "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
