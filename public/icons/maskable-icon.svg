  <rect x="136" y="168" width="192" height="44" rx="16" fill="#34d399"/>
  <circle cx="316" cy="278" r="22" fill="#022c22"/>
  <text x="228" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" text-anchor="middle" fill="#022c22">BC</text>
</svg>
